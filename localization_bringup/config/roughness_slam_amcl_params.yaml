amcl:
  ros__parameters:
    # 기본 설정
    use_sim_time: true  # launch 파일에서 override 가능 (bag 재생 시 true로 설정)
    set_initial_pose: true

    # TF 설정
    tf_broadcast: true
    transform_tolerance: 3.0   # lidar 가림 시 AMCL scan을 잠깐 차단해도 map->odom TF가 유지되도록 설정
    scan_topic: "/scan_amcl"

    # 파티클 필터 설정
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    # 업데이트 조건
    update_min_d: 0.02          # 최소 이동 거리 (m) - vibration-only update 억제
    update_min_a: 0.01          # 최소 회전 각도 (rad) - vibration-only update 억제
    resample_interval: 1       # 리샘플링 간격

    # 복구 모드
    recovery_alpha_slow: 0.0   # 느린 복구 알파
    recovery_alpha_fast: 0.0   # 빠른 복구 알파

    # 초기 위치 설정
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # 레이저 모델 설정
    laser_model_type: "likelihood_field_prob"
    laser_max_range: -1.0      # -1.0 = 무제한
    laser_min_range: -1.0      # -1.0 = scan message range_min 사용
    max_beams: 60
    z_hit: 0.95
    z_short: 0.1
    z_max: 0.05
    z_rand: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0

    # 오도메트리 모델 설정
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2                # 회전에 의한 회전 노이즈
    alpha2: 0.2                # 이동에 의한 회전 노이즈
    alpha3: 0.2                # 이동에 의한 이동 노이즈
    alpha4: 0.2                # 회전에 의한 이동 노이즈
    alpha5: 0.1                # 회전에 의한 이동 노이즈 (omni)

    # 오도메트리 프레임
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    global_frame_id: "map"

    # 기타 설정
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
