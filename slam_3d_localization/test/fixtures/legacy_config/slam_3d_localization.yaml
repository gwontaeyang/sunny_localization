slam_3d_localizer:
  ros__parameters:
    map_path: ""
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    # These three frames must be nonempty and pairwise distinct. Odometry
    # messages must exactly declare odom_frame -> base_frame.
    cloud_topic: /slam_3d/points/center
    odom_topic: /odometry/filtered
    registration_odom_topic: ""
    initial_pose_topic: /initialpose
    pose_topic: /localization_3d/odom
    aligned_cloud_topic: /localization_3d/aligned_points
    local_map_topic: /localization_3d/local_map
    global_map_topic: /localization_3d/global_map
    diagnostics_topic: /localization_3d/diagnostics
    registration_method: gicp
    cloud_subscription_reliable: false
    cloud_subscription_depth: 5
    # Keep legacy behavior by default. LIO profiles enable this so a scan
    # cannot update map localization without odometry at the same timestamp.
    require_synced_odom_for_update: false
    require_exact_odom_for_update: false
    odom_sync_pending_cloud_limit: 4
    # After an accepted localization with synchronized odometry, publish the
    # cached map -> odom transform at each strictly newer odometry stamp.
    publish_tf: true
    # Optional visualization bootstrap; keep false unless map and odom origins coincide.
    publish_identity_map_to_odom_before_localization: false
    publish_local_map: false
    # Publish the original PCD fields (including RGB) once with transient-local QoS.
    publish_global_map: true
    input_scan_preprocessed: false
    map_already_voxelized: false
    crop_box_enabled: false
    tf_timeout_s: 0.05
    # Compute-first defaults; runtime quality gates still apply.
    scan_voxel_leaf_m: 0.8
    map_voxel_leaf_m: 0.8
    local_map_radius_m: 15.0
    # Reuse the local-map target and CPU/GPU covariances until the prediction
    # moves 5 m from its center. Set zero to request the legacy per-scan crop.
    local_map_rebuild_distance_m: 5.0
    min_range_m: 0.5
    max_range_m: 30.0
    z_min_m: -5.0
    z_max_m: 8.0
    crop_min_x: -0.7
    crop_max_x: 0.7
    crop_min_y: -0.55
    crop_max_y: 0.55
    crop_min_z: -0.8
    crop_max_z: 0.9
    max_iterations: 8
    max_correspondence_m: 2.0
    transformation_epsilon: 0.001
    fitness_epsilon: 0.001
    fitness_threshold: 1.0
    # Used only when registration_method selects a fast_gicp backend.
    fast_gicp_num_threads: 4
    fast_gicp_correspondence_randomness: 20
    fast_gicp_regularization_method: PLANE
    fast_gicp_rotation_epsilon_rad: 0.002
    # FastVGICP is voxelized GICP and is not mathematically identical to PCL GICP.
    fast_vgicp_cuda_voxel_resolution_m: 1.0
    fast_vgicp_cuda_neighbor_search_method: DIRECT1
    fast_vgicp_cuda_neighbor_search_radius: 1.5
    fast_vgicp_cuda_nearest_neighbor_method: CPU_PARALLEL_KDTREE
    fast_vgicp_cuda_kernel_width: 0.5
    fast_vgicp_cuda_kernel_max_distance: 3.0
    min_registration_inlier_ratio: 0.15
    max_registration_inlier_rmse_m: 1.5
    max_correction_translation_m: 2.0
    max_correction_rotation_deg: 30.0
    update_min_translation_m: 0.5
    update_min_rotation_deg: 5.0
    # Backward-compatible pose hold. Enable for wheel-less replay/profile only.
    use_constant_velocity_prediction: false
    constant_velocity_translation_limit_m: 0.30
    constant_velocity_rotation_limit_deg: 10.0
    constant_velocity_max_gap_s: 0.50
    # Disabled by default. Site/replay profiles may bound scan queue latency.
    max_cloud_age_s: 0.0
    cloud_timestamp_reset_threshold_s: 1.0
    odom_buffer_duration_s: 5.0
    odom_max_interpolation_gap_s: 0.20
    odom_max_nearest_age_s: 0.05
    odom_timestamp_reset_threshold_s: 1.0
    min_scan_points: 100
    min_local_map_points: 200
    surfel_voxel_size_m: 2.0
    surfel_min_points_per_voxel: 3
    surfel_max_planarity_ratio: 0.15
    surfel_min_tangent_variance: 0.0001
    surfel_max_plane_distance_m: 0.35
    surfel_max_center_distance_m: 2.5
    surfel_min_correspondences: 40
    surfel_min_correspondence_ratio: 0.20
    surfel_huber_delta_m: 0.10
    surfel_max_iterations: 4
    surfel_max_backtracking_steps: 2
    surfel_backtracking_factor: 0.5
    surfel_rotation_convergence_rad: 0.0001
    surfel_translation_convergence_m: 0.0001
    surfel_relative_cost_convergence: 0.000001
    surfel_max_rotation_step_rad: 0.20
    surfel_max_translation_step_m: 0.50
    surfel_rotation_scale_m_per_rad: 1.0
    surfel_relative_eigen_threshold: 0.001
    surfel_min_observable_rank: 3
    surfel_max_quality_rmse_m: 0.25
    surfel_max_quality_p95_m: 0.45
