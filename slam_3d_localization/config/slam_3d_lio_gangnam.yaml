slam_3d_lio_odometry:
  ros__parameters:
    # Only the sensor mounting differs; point_time_mode uses the C++ default auto.
    # Topics, frames and tuning also use C++ defaults.
    # Use slam_3d_lio_localization.launch.py for the LIO-to-map connections.
    # Stage 29/30 sensor mounting: base-aligned rotation and IMU-origin offset.
    imu_position_in_base_m: [0.0, 0.0, 1.20984]
