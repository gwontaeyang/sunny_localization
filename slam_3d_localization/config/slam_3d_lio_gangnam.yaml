slam_3d_lio_odometry:
  ros__parameters:
    # Gangnam raw sensor contract. This node is the only odom -> base_link
    # owner in the LIO launch.
    cloud_topic: /hesai/center/lidar_points
    imu_topic: /imu/data
    odom_topic: /localization_3d/lio/odom
    scan_odom_topic: /localization_3d/lio/scan_odom
    deskewed_cloud_topic: /localization_3d/lio/deskewed_points
    diagnostics_topic: /localization_3d/lio/diagnostics
    odom_frame: odom
    base_frame: base_link
    imu_frame: cv7_link
    publish_tf: true

    # The recorded Hesai field contains absolute seconds for each point.
    point_time_field: timestamp
    point_time_mode: absolute_seconds
    require_point_time: true
    max_scan_duration_s: 0.20
    point_time_header_tolerance_s: 0.02
    pending_cloud_limit: 4
    cloud_subscription_reliable: false
    cloud_subscription_depth: 4
    tf_timeout_s: 0.05

    # Stage 29/30 map lineage validated identity base_link -> cv7_link
    # rotation and a [0, 0, 1.20984] m translation. Older Rx180 replay
    # experiments are not the source contract for the current map.
    imu_to_base_rpy_deg: [0.0, 0.0, 0.0]
    imu_position_in_base_m: [0.0, 0.0, 1.20984]
    imu_initialization_min_samples: 100
    imu_initialization_min_duration_s: 0.5
    imu_initialization_min_acceleration_norm_mps2: 8.5
    imu_initialization_max_acceleration_norm_mps2: 11.0
    imu_initialization_max_acceleration_norm_std_mps2: 0.35
    imu_initialization_max_gyroscope_mean_norm_radps: 0.05
    imu_initialization_max_gyroscope_residual_rms_radps: 0.05
    gravity_mps2: 9.80665
    max_imu_gap_s: 0.05
    imu_gap_position_std_m: 0.20
    imu_gap_velocity_std_mps: 0.75
    imu_gap_orientation_std_deg: 5.0
    imu_epoch_reset_threshold_s: 1.0
    imu_buffer_duration_s: 5.0

    accelerometer_noise_mps2_sqrt_hz: 0.15
    gyroscope_noise_radps_sqrt_hz: 0.015
    accelerometer_bias_noise_mps3_sqrt_hz: 0.001
    gyroscope_bias_noise_radps2_sqrt_hz: 0.0001
    max_angular_velocity_radps: 20.0
    max_linear_acceleration_mps2: 100.0
    initial_position_std_m: 0.05
    initial_velocity_std_mps: 0.20
    initial_orientation_std_rad: 0.05
    initial_accelerometer_bias_std_mps2: 0.10
    initial_gyroscope_bias_std_radps: 0.02

    # Raw cloud preprocessing and rolling LIO submap.
    crop_box_enabled: true
    crop_min_xyz_m: [-0.7, -0.55, -0.8]
    crop_max_xyz_m: [0.7, 0.55, 0.9]
    min_range_m: 0.5
    max_range_m: 80.0
    z_min_m: -5.0
    z_max_m: 8.0
    scan_voxel_leaf_m: 0.25
    submap_voxel_leaf_m: 0.30
    local_submap_radius_m: 25.0
    min_scan_points: 300
    min_submap_points: 500
    max_keyframes: 40
    keyframe_translation_m: 0.50
    keyframe_rotation_deg: 8.0

    registration_method: voxel_surfel
    gicp_max_iterations: 40
    gicp_max_correspondence_m: 2.0
    fitness_threshold: 1.0
    max_correction_translation_m: 1.5
    max_correction_rotation_deg: 25.0
    lidar_translation_std_min_m: 0.03
    lidar_rotation_std_min_deg: 0.5
    lidar_noise_scale: 0.25
    lidar_pose_nis_gate: 100.0
    lidar_weak_axis_noise_multiplier: 10.0
    surfel_voxel_size_m: 0.6
    surfel_min_points_per_voxel: 5
    surfel_max_planarity_ratio: 0.25
    surfel_min_tangent_variance: 0.0001
    surfel_max_plane_distance_m: 0.35
    surfel_max_center_distance_m: 1.2
    surfel_min_correspondences: 150
    surfel_min_correspondence_ratio: 0.08
    surfel_huber_delta_m: 0.10
    surfel_max_iterations: 12
    surfel_max_backtracking_steps: 5
    surfel_backtracking_factor: 0.5
    surfel_rotation_convergence_rad: 0.0002
    surfel_translation_convergence_m: 0.0002
    surfel_relative_cost_convergence: 0.00001
    surfel_max_rotation_step_rad: 0.20
    surfel_max_translation_step_m: 0.50
    surfel_rotation_scale_m_per_rad: 1.0
    surfel_relative_eigen_threshold: 0.001
    surfel_min_observable_rank: 3
    surfel_max_quality_rmse_m: 0.30
    surfel_max_quality_p95_m: 0.50

    # Optional future aiding input. Disabled means no wheel subscription is
    # created and wheel data cannot affect the current LIO state.
    wheel_correction_enabled: false
    wheel_topic: /motor_driver_node/odom
    wheel_max_age_s: 0.05
    wheel_max_abs_speed_mps: 3.0
    wheel_max_innovation_mps: 1.0
    wheel_fallback_std_mps: 0.20

slam_3d_localizer:
  ros__parameters:
    map_path: ""
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    cloud_topic: /localization_3d/lio/deskewed_points
    odom_topic: /localization_3d/lio/odom
    registration_odom_topic: /localization_3d/lio/scan_odom
    initial_pose_topic: /initialpose
    pose_topic: /localization_3d/odom
    aligned_cloud_topic: /localization_3d/aligned_points
    local_map_topic: /localization_3d/local_map
    global_map_topic: /localization_3d/global_map
    diagnostics_topic: /localization_3d/diagnostics

    # LIO supplies the only motion prior. Never fall back to pose extrapolation
    # or accept a map correction without odometry at the scan timestamp.
    require_synced_odom_for_update: true
    require_exact_odom_for_update: true
    odom_sync_pending_cloud_limit: 4
    use_constant_velocity_prediction: false
    publish_tf: true
    publish_identity_map_to_odom_before_localization: false

    # GICP is used against the frozen prior map because the held-out 071436
    # bootstrap had high geometric overlap but too few surfel correspondences.
    # The rolling LIO frontend above remains voxel-surfel.
    registration_method: gicp
    input_scan_preprocessed: true
    map_already_voxelized: false
    crop_box_enabled: false
    cloud_subscription_reliable: true
    cloud_subscription_depth: 10
    publish_local_map: true
    publish_global_map: true
    tf_timeout_s: 0.05

    # Scan filtering is owned by LIO while the loaded prior map is normalized
    # once at startup with map_voxel_leaf_m.
    scan_voxel_leaf_m: 0.25
    map_voxel_leaf_m: 0.35
    local_map_radius_m: 35.0
    min_range_m: 0.5
    max_range_m: 80.0
    z_min_m: -5.0
    z_max_m: 8.0
    crop_min_x: -0.7
    crop_max_x: 0.7
    crop_min_y: -0.55
    crop_max_y: 0.55
    crop_min_z: -0.8
    crop_max_z: 0.9

    max_iterations: 40
    max_correspondence_m: 2.0
    transformation_epsilon: 0.001
    fitness_epsilon: 0.001
    fitness_threshold: 1.0
    min_registration_inlier_ratio: 0.15
    max_registration_inlier_rmse_m: 1.5
    max_correction_translation_m: 2.0
    max_correction_rotation_deg: 30.0
    update_min_translation_m: 0.0
    update_min_rotation_deg: 0.0
    constant_velocity_translation_limit_m: 0.30
    constant_velocity_rotation_limit_deg: 10.0
    constant_velocity_max_gap_s: 0.50
    max_cloud_age_s: 0.0
    cloud_timestamp_reset_threshold_s: 1.0
    odom_buffer_duration_s: 5.0
    odom_max_interpolation_gap_s: 0.10
    odom_max_nearest_age_s: 0.05
    odom_timestamp_reset_threshold_s: 1.0
    min_scan_points: 300
    min_local_map_points: 500

    surfel_voxel_size_m: 0.6
    surfel_min_points_per_voxel: 8
    surfel_max_planarity_ratio: 0.15
    surfel_min_tangent_variance: 0.0001
    surfel_max_plane_distance_m: 0.35
    surfel_max_center_distance_m: 1.2
    surfel_min_correspondences: 40
    surfel_min_correspondence_ratio: 0.20
    surfel_huber_delta_m: 0.10
    surfel_max_iterations: 20
    surfel_max_backtracking_steps: 8
    surfel_backtracking_factor: 0.5
    surfel_rotation_convergence_rad: 0.0001
    surfel_translation_convergence_m: 0.0001
    surfel_relative_cost_convergence: 0.000001
    surfel_max_rotation_step_rad: 0.20
    surfel_max_translation_step_m: 0.50
    surfel_rotation_scale_m_per_rad: 1.0
    surfel_relative_eigen_threshold: 0.001
    surfel_min_observable_rank: 3
    surfel_max_quality_rmse_m: 0.25
    surfel_max_quality_p95_m: 0.45
